<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimal Dashboard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
  }

  /* YouTube Background */
  #yt-bg-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
    background: black;
  }

  #yt-bg-container iframe {
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Left Panel: Clock + GitHub + Spotify */
  #leftPanel {
    position: absolute;
    top: 2%;
    left: 2%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 35%;
  }

  .overlay {
    border-radius: 12px;
    padding: 10px;
  }

  /* Clock Section */
  #clockSection {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: transparent; /* make clock block fully transparent */
  }

  #analogClock {
    background: rgba(0,0,0,0.4); /* keep the semi-transparent face */
    border-radius: 50%;
    max-width: 100px;
    max-height: 100px;
  }

  #clock {
    font-size: 1.2rem;
    font-weight: bold;
    line-height: 1.2;
  }

  /* GitHub and Spotify transparent */
  #githubStats, #spotifyContainer, #weather {
    background: transparent;
    box-shadow: none;
  }

  #githubStats {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  #githubStats img {
    width: 100%;
    border-radius: 12px;
  }

  #spotifyContainer {
    width: 280px;
    height: 352px;
    border-radius: 12px;
    overflow: hidden;
  }

  #spotifyContainer iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Weather Center Top */
  #weather {
    position: absolute;
    top: 2%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    border-radius: 12px;
    padding: 10px;
    color: white;
  }

  #weather img {
    width: 40px;
    height: 40px;
  }

  /* Responsive */
  @media (max-width: 1200px) {
    #leftPanel { max-width: 45%; }
    #clock { font-size: 1rem; }
    #analogClock { max-width: 80px; max-height: 80px; }
    #weather { font-size: 0.9rem; }
    #weather img { width: 35px; height: 35px; }
    #spotifyContainer { width: 220px; height: 280px; }
  }

  @media (max-width: 768px) {
    #leftPanel { max-width: 55%; }
    #clock { font-size: 0.9rem; }
    #analogClock { max-width: 70px; max-height: 70px; }
    #weather { font-size: 0.8rem; }
    #weather img { width: 30px; height: 30px; }
    #spotifyContainer { width: 180px; height: 220px; }
  }

  @media (max-width: 480px) {
    #leftPanel { max-width: 70%; }
    #clock { font-size: 0.8rem; }
    #analogClock { max-width: 60px; max-height: 60px; }
    #weather { font-size: 0.7rem; }
    #weather img { width: 25px; height: 25px; }
    #spotifyContainer { width: 140px; height: 180px; }
  }
</style>
</head>
<body>

<!-- YouTube Background -->
<div id="yt-bg-container">
  <iframe
    src="https://www.youtube.com/embed/zEsbZSRtM7E?autoplay=1&mute=1&controls=0&loop=1&playlist=zEsbZSRtM7E&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3"
    frameborder="0"
    allow="autoplay; fullscreen"
    allowfullscreen
  ></iframe>
</div>

<!-- Left Panel: Clock + GitHub + Spotify -->
<div id="leftPanel">
  <div id="clockSection" class="overlay">
    <canvas id="analogClock" width="100" height="100"></canvas>
    <div id="clock">Loading...</div>
  </div>

  <div id="githubStats" class="overlay">
    <img src="https://github-readme-stats.vercel.app/api?username=PrinceTp&show_icons=true&theme=tokyonight" />
    <img src="https://github-readme-streak-stats.herokuapp.com?user=PrinceTp&theme=tokyonight" />
  </div>

  <div id="spotifyContainer" class="overlay">
    <iframe src="https://open.spotify.com/embed/album/2HwRKkEp7jXbxXwcGyZYHK?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
</div>

<!-- Weather Center Top -->
<div id="weather">Loading weather...</div>

<script>
  // --- Digital Clock ---
  function updateClock() {
      const now = new Date();
      const day = now.getDate();
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const month = monthNames[now.getMonth()];
      const year = now.getFullYear();
      const dateStr = `${day} ${month}, ${year}`;
      const hours = now.getHours().toString().padStart(2,'0');
      const minutes = now.getMinutes().toString().padStart(2,'0');
      const seconds = now.getSeconds().toString().padStart(2,'0');
      document.getElementById('clock').innerHTML = `${dateStr}<br>${hours}:${minutes}:${seconds}`;
  }

  // --- Analog Clock ---
  const canvas = document.getElementById("analogClock");
  const ctx = canvas.getContext("2d");
  const radius = canvas.height / 2;
  ctx.translate(radius, radius);

  function drawClock() {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
      drawFace(ctx, radius);
      drawNumbers(ctx, radius);
      drawTime(ctx, radius);
  }

  function drawFace(ctx, radius) {
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, 2 * Math.PI);
      ctx.fillStyle = "rgba(0,0,0,0.4)"; // keep semi-transparent face
      ctx.fill();
      ctx.strokeStyle = "white";
      ctx.lineWidth = 3;
      ctx.stroke();
  }

  function drawNumbers(ctx, radius) {
      ctx.font = radius*0.15 + "px Arial";
      ctx.textBaseline="middle";
      ctx.textAlign="center";
      for(let num=1; num<=12; num++){
          let ang = num * Math.PI / 6;
          ctx.rotate(ang);
          ctx.translate(0, -radius*0.75);
          ctx.rotate(-ang);
          ctx.fillStyle = "white";
          ctx.fillText(num.toString(), 0, 0);
          ctx.rotate(ang);
          ctx.translate(0, radius*0.75);
          ctx.rotate(-ang);
      }
  }

  function drawTime(ctx, radius){
      const now = new Date();
      let hour = now.getHours();
      let minute = now.getMinutes();
      let second = now.getSeconds();
      hour = hour%12;
      hour = (hour*Math.PI/6) + (minute*Math.PI/(6*60)) + (second*Math.PI/(360*60));
      drawHand(ctx, hour, radius*0.5, 5);
      let minuteAngle = (minute*Math.PI/30) + (second*Math.PI/(30*60));
      drawHand(ctx, minuteAngle, radius*0.75, 3);
      let secondAngle = second*Math.PI/30;
      drawHand(ctx, secondAngle, radius*0.85, 2, "red");
  }

  function drawHand(ctx, pos, length, width, color="white"){
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.moveTo(0,0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
  }

  // --- Weather ---
  const weatherKey = "ee5da5ae176d82a195ab69092b8052a5";
  const lat = "12.971599";
  const lon = "77.594566";

  fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${weatherKey}&units=metric`)
  .then(res => res.json())
  .then(data => {
      const temp = data.main.temp;
      const description = data.weather[0].description;
      const city = data.name;
      const icon = data.weather[0].icon;
      const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
      document.getElementById('weather').innerHTML = `
        <img src="${iconUrl}" alt="${description}"> ${city}: ${temp}°C, ${description}
      `;
  })
  .catch(err => {
      console.error("Weather fetch error:", err);
      document.getElementById('weather').textContent = "Weather unavailable";
  });

  setInterval(()=>{
      updateClock();
      drawClock();
  }, 1000);

  updateClock();
  drawClock();
</script>
</body>
</html>
